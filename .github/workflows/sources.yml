name: Sources

# Every document and font in this repository has a stated origin.
#
# This repository is public, so a file committed here is published to anyone.
# On 2026-08-27 a third-party government form was found here, added months
# earlier as a test fixture; the question of whether we may redistribute it had
# never been asked. This job asks it at commit time instead.
on:
  push:
  pull_request:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the second check walks every object, and a
          # shallow clone would walk a fraction of them and pass.
          fetch-depth: 0
      - run: python3 scripts/ci/every_document_has_a_source.py
      # And: is anything back that was withdrawn once? The check above sees a
      # file arriving in the working tree. It does not see
      # `git checkout <old-sha> -- <path>`, which brings content back under any
      # name -- and the next person adds it to SOURCES.md in good faith, because
      # nothing tells them it was taken out.
      - run: python3 scripts/ci/no_withdrawn_blobs.py

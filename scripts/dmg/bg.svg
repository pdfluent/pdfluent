<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glow)"/>

  <!-- brand kicker -->
  <g transform="translate(330.0, 50)" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">
    <text y="0" font-size="12" letter-spacing="3" fill="#94a3b8" font-weight="600">P D F L U E N T</text>
  </g>

  <!-- headline + the one instruction that matters -->
  <g transform="translate(330.0, 92)" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">
    <text y="0" font-size="27" fill="#0f172a" font-weight="700">Own your PDFs again.</text>
    <text y="28" font-size="14" fill="#64748b" font-weight="500">Drag PDFluent onto the Applications folder to install.</text>
  </g>

  <!-- playful nudge + arrow between the app icon (165) and Applications (495) at y=188 -->
  <text x="335" y="166" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700"
        fill="#2563eb" letter-spacing="0.5">drag me</text>
  <g filter="url(#soft)">
    <line x1="236" y1="188" x2="394" y2="188" stroke="url(#arrow)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 388 169 L 432 188 L 388 207 Z" fill="#2563eb"/>
  </g>

  <!-- value-prop footer -->
  <text x="330.0" y="372" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8" letter-spacing="0.3">
    No account  ·  No subscription  ·  Free for personal use
  </text>
</svg>
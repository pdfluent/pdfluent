#
# Isolated objc2 crate for macOS security-scoped bookmarks and PDFKit printing. Lives outside the
# main `pdfluent-desktop` crate (which keeps `#![forbid(unsafe_code)]`) so the
# small amount of required `unsafe` objc2 interop is contained here. Non-macOS
# targets compile to no-op stubs.
#
# Bookmarks are minted from the path the user just picked via Tauri's open
# dialog — that pick grants the process powerbox access, and under the
# `files.user-selected.read-write` entitlement a security-scoped bookmark can be
# created for any currently-accessible file. No custom NSOpenPanel / AppKit is
# needed for this; if path-based minting ever fails on a target OS we fall back
# to a native panel (kept out of scope unless proven necessary).
[package]
name = "pdfluent-macos-secure"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PDFluent-Proprietary"
publish = false

[dependencies]
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# Managed-preference read (managed_prefs.rs). Both are already in the lock
# through the webview stack; this adds an edge, not a crate.
core-foundation = "0.10"
core-foundation-sys = "0.8"
# Printing through PDFKit (print.rs). The 0.6 / 0.3 family is the one the
# webview stack already links, so these add no crate to the build, only
# features of crates that are in it.
objc2_06 = { package = "objc2", version = "0.6" }
objc2-app-kit-03 = { package = "objc2-app-kit", version = "0.3", default-features = false, features = [
    "std",
    "NSPrintInfo",
    "NSPrintOperation",
] }
objc2-foundation-03 = { package = "objc2-foundation", version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
] }
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSData",
    "NSURL",
    "NSError",
    "NSArray",
] }

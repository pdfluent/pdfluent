[package]
name = "pdfluent-desktop"
version = "1.0.0-beta.21"
description = "Privacy-first desktop PDF editor powered by the XFA Rust SDK"
authors = ["Innovation Trigger B.V."]
license = "LicenseRef-PDFluent-Proprietary"
repository = "https://github.com/pdfluent/pdfluent"
edition = "2021"

[lib]
name = "pdfluent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
dirs = "5"
open = "5"
flate2 = "1"
# macOS security-scoped bookmarks (recent-files reopen under App Sandbox).
# Isolated crate so this main crate keeps `#![forbid(unsafe_code)]`.
pdfluent-macos-secure = { path = "crates/macos-secure" }

# PDFluent SDK (engine) — every crate at one pinned revision.
#
# A pin, not a path: until 2026-09-07 these were 19 path dependencies into a
# checkout next to this repository, so the editor built against whatever branch
# that working copy happened to be on and CI cloned a third state. The revision
# below is on `pdfluent/engine` master and carries the removal of the free-tier
# PDF/A stamp (`f9ae3a1d7`); `src/pdfa_export_guard.rs` proves the export comes
# out unmarked.
#
# Move them together, never one at a time — `tests/sdk-pin-guard.test.ts` fails
# if the revisions drift apart or a path dependency comes back. Moving the pin
# also means checking the engine's GitLab mirror carries the revision: the CI
# runner reaches the engine through it (see the `insteadOf` line in
# `.github/actions/sdk-pin/action.yml`), so a commit that only GitHub has builds here and nowhere
# else. Engine master is fast-forward only, so the mirror catches up on its
# own; a tag pipeline cut before it does will fail on the fetch.
pdf-engine = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf", features = ["xfa", "serde"] }
pdf-forms = { package = "pdfluent-forms", git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-annot = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf", features = ["write"] }
pdf-sign = { package = "pdfluent-sign", git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-manip = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf", features = ["image-insert", "font-subset", "pdfa-convert"] }
pdf-text-format = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-compliance = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-extract = { package = "pdfluent-extract", git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-redact = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-docx = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-xlsx = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-pptx = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-invoice = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
lopdf = { package = "pdfluent-lopdf", git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }
pdf-syntax = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }

# PDFluent public SDK facade (Phase 2 migration boundary)
pdfluent = { git = "https://github.com/pdfluent/engine", rev = "5b2e506bbe957a9db8f21f43978c400621f8f1bf" }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
# Optional so the Mac App Store build can drop them (see the `updater` feature).
tauri-plugin-updater = { version = "2", optional = true }
# Restart the app to finish applying an installed update (frontend relaunch()).
tauri-plugin-process = { version = "2", optional = true }

[features]
default = ["custom-protocol", "updater"]
custom-protocol = ["tauri/custom-protocol"]
# Self-updater + relaunch. On by default for direct distribution. The Mac App
# Store build omits it with `--no-default-features --features custom-protocol`
# (App Store delivers updates; Apple forbids app self-updating).
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# XFA Phase 2 interactive commit loop. Enabling this compiles the engine's
# sandboxed QuickJS runtime (pdf-engine/xfa-js-sandboxed) and routes XFA field
# commits through `XfaSession::commit_value` (change/click + calculate scripts →
# re-layout → presence changes).
#
# It does NOT build against the pinned revision: `commit_value` lives only on
# the engine branch `xfa/sdk-phase2-commit-loop` and has never been merged to
# master. Landing it there is pdfluent/pdfluent-internal#406; until that is
# done and the pin has moved past it, this feature cannot be turned on and the
# editor uses the Phase 1 static value write (`set_value`), which compiles
# against any XFA-capable revision.
xfa-interactive = ["pdf-engine/xfa-js-sandboxed"]

# Render hot loops (vello_cpu rasteriser, PDF interpreter) benefit from
# cross-crate inlining. Thin LTO recovers most of the fat-LTO speedup at an
# acceptable build-time cost; without this section the SDK ships with plain
# Cargo defaults (no LTO, 16 codegen units).
[profile.release]
lto = "thin"
codegen-units = 4
